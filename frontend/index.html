<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SEO -->
  <title>Devploy — Deploy Websites Instantly from GitHub</title>
  <meta
    name="description"
    content="Devploy is a modern deployment platform that lets developers deploy GitHub projects in seconds. Connect your repository, build your project, and launch it with one click."
  >
  <meta name="keywords" content="website deployment, GitHub deployment, developer deployment platform, deploy website, Devploy">
  <meta name="robots" content="index, follow">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --black: #000000;
      --black-1: #050505;
      --black-2: #080808;
      --black-3: #0d0d0d;
      --black-4: #111111;

      --white: #ffffff;
      --white-90: rgba(255,255,255,.90);
      --white-70: rgba(255,255,255,.70);
      --white-50: rgba(255,255,255,.50);
      --white-30: rgba(255,255,255,.30);
      --white-15: rgba(255,255,255,.15);
      --white-08: rgba(255,255,255,.08);
      --white-05: rgba(255,255,255,.05);

      --border: rgba(255,255,255,.10);
      --border-hover: rgba(255,255,255,.24);

      --max-width: 1200px;

      --ease: cubic-bezier(.22, 1, .36, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Inter", sans-serif;
      background: var(--black);
      color: var(--white);
      overflow-x: hidden;
      line-height: 1.6;
    }

    ::selection {
      background: #fff;
      color: #000;
    }

    a {
      color: inherit;
    }

    button,
    input {
      font: inherit;
    }

    .container {
      width: min(var(--max-width), 90%);
      margin-inline: auto;
    }

    /* =========================
       BACKGROUND
    ========================= */

    .background {
      position: fixed;
      inset: 0;
      z-index: -10;
      pointer-events: none;
      background:
        radial-gradient(
          circle at 15% 10%,
          rgba(255,255,255,.07),
          transparent 28%
        ),
        radial-gradient(
          circle at 85% 20%,
          rgba(255,255,255,.045),
          transparent 25%
        ),
        radial-gradient(
          circle at 50% 100%,
          rgba(255,255,255,.04),
          transparent 35%
        ),
        #000;
    }

    .grid-bg {
      position: fixed;
      inset: 0;
      z-index: -9;
      pointer-events: none;
      opacity: .28;

      background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);

      background-size: 60px 60px;

      mask-image: linear-gradient(
        to bottom,
        black,
        transparent 90%
      );
    }

    .noise {
      position: fixed;
      inset: 0;
      z-index: -8;
      pointer-events: none;
      opacity: .035;

      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E");
    }

    /* =========================
       NAVBAR
    ========================= */

    .navbar {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: min(1160px, 92%);
      z-index: 1000;

      border: 1px solid var(--border);
      border-radius: 18px;

      background: rgba(8,8,8,.76);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);

      box-shadow:
        0 20px 70px rgba(0,0,0,.45),
        inset 0 1px rgba(255,255,255,.04);

      animation: navEnter .8s var(--ease) both;
    }

    .nav-inner {
      min-height: 70px;
      padding: 0 10px 0 16px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 11px;

      font-family: "Space Grotesk", sans-serif;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -.03em;
      text-decoration: none;
    }

    .logo-icon {
      width: 38px;
      height: 38px;

      display: grid;
      place-items: center;

      border-radius: 11px;

      background: #fff;
      color: #000;

      font-family: "Space Grotesk", sans-serif;
      font-size: 1.05rem;
      font-weight: 700;

      box-shadow:
        0 0 0 1px rgba(255,255,255,.2),
        0 8px 30px rgba(255,255,255,.12);

      transition:
        transform .4s var(--ease),
        box-shadow .4s var(--ease);
    }

    .logo:hover .logo-icon {
      transform: rotate(-6deg) scale(1.06);
      box-shadow:
        0 0 0 1px rgba(255,255,255,.4),
        0 12px 40px rgba(255,255,255,.18);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* =========================
       BUTTONS
    ========================= */

    .btn {
      position: relative;
      isolation: isolate;

      min-height: 48px;
      padding: 0 19px;

      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;

      border-radius: 12px;

      text-decoration: none;
      font-size: .9rem;
      font-weight: 700;

      cursor: pointer;

      border: 1px solid transparent;

      transition:
        transform .35s var(--ease),
        background .35s var(--ease),
        color .35s var(--ease),
        border-color .35s var(--ease),
        box-shadow .35s var(--ease);
    }

    .btn::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;

      border-radius: inherit;

      background: linear-gradient(
        120deg,
        transparent 20%,
        rgba(255,255,255,.22),
        transparent 80%
      );

      transform: translateX(-120%);
      transition: transform .65s var(--ease);
    }

    .btn:hover::after {
      transform: translateX(120%);
    }

    .btn:hover {
      transform: translateY(-3px);
    }

    .btn:active {
      transform: translateY(-1px) scale(.98);
    }

    .btn-primary {
      background: #fff;
      color: #000;

      box-shadow:
        0 10px 30px rgba(255,255,255,.10);
    }

    .btn-primary:hover {
      background: #e9e9e9;

      box-shadow:
        0 15px 40px rgba(255,255,255,.18);
    }

    .btn-secondary {
      background: rgba(255,255,255,.035);
      color: #fff;
      border-color: var(--border);
    }

    .btn-secondary:hover {
      background: rgba(255,255,255,.09);
      border-color: var(--border-hover);
    }

    /* =========================
       HERO
    ========================= */

    .hero {
      min-height: 100vh;
      padding-top: 190px;
      padding-bottom: 120px;

      display: flex;
      align-items: center;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.05fr .95fr;
      align-items: center;
      gap: 80px;
    }

    .hero-content {
      animation: heroText .9s var(--ease) .1s both;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;

      margin-bottom: 25px;
      padding: 7px 12px;

      border: 1px solid
