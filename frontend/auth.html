<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Devploy Authentication</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>

<script>

if(
  location.hostname === "localhost" ||

  location.hostname.includes("127.0.0.1") ||

  location.hostname.includes("netlify") ||

  localStorage.getItem("debug") === "true"
){

  eruda.init();

}

</script>
  <style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}

body{
background:#f4f8ff;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.card{
width:100%;
max-width:420px;
background:white;
border-radius:20px;
padding:30px;
box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.logo{
font-size:32px;
font-weight:700;
color:#2563eb;
text-align:center;
margin-bottom:10px;
}

.subtitle{
text-align:center;
color:#6b7280;
margin-bottom:25px;
}

.tabs{
display:flex;
gap:10px;
margin-bottom:20px;
}

.tab{
flex:1;
padding:12px;
border:none;
border-radius:12px;
background:#eef4ff;
cursor:pointer;
font-weight:600;
}

.tab.active{
background:#2563eb;
color:white;
}

.form{
display:none;
}

.form.active{
display:block;
}

label{
display:block;
margin-bottom:6px;
font-size:14px;
font-weight:600;
}

input{
width:100%;
padding:13px;
border:1px solid #dbe3f0;
border-radius:12px;
margin-bottom:15px;
outline:none;
font-size:15px;
}

input:focus{
border-color:#2563eb;
}

.btn{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:#2563eb;
color:white;
font-weight:600;
cursor:pointer;
}

.btn:hover{
opacity:.95;
}

.message{
display:none;
padding:12px;
border-radius:12px;
margin-bottom:15px;
font-size:14px;
}

.error{
background:#ffe6e6;
color:#d60000;
}

.success{
background:#e6fff0;
color:#008a3b;
}

.loading{
opacity:.6;
pointer-events:none;
}

.small{
font-size:13px;
color:#6b7280;
margin-top:8px;
text-align:center;
}

</style></head>
<body><div class="card"><div class="logo">Devploy</div><div class="subtitle">
Deploy static sites instantly
</div><div class="tabs">
<button class="tab active" onclick="switchTab('login')">
Login
</button><button class="tab" onclick="switchTab('register')">
Register
</button>
</div><div id="msg" class="message"></div><!-- LOGIN --><form id="loginForm" class="form active"><label>Username</label>

<input
type="text"
id="loginUser"
placeholder="Enter username">

<label>Password</label>

<input
type="password"
id="loginPass"
placeholder="Enter password">

<button class="btn">
Login
</button></form><!-- REGISTER --><form id="registerForm" class="form"><label>Username</label>

<input
type="text"
id="regUser"
placeholder="Choose username">

<label>Password</label>

<input
type="password"
id="regPass"
placeholder="Create password">

<label>Confirm Password</label>

<input
type="password"
id="regPass2"
placeholder="Confirm password">

<button class="btn">
Create Account
</button><div class="small">
Minimum 6 character password
</div></form></div><script>

const API =
"https://devploy.onrender.com";

function showMessage(
text,
type
){

const msg =
document.getElementById("msg");

msg.style.display="block";

msg.className=
`message ${type}`;

msg.textContent=text;
}

function switchTab(tab){

document
.querySelectorAll(".tab")
.forEach(t=>t.classList.remove("active"));

document
.querySelectorAll(".form")
.forEach(f=>f.classList.remove("active"));

if(tab==="login"){

document
.querySelectorAll(".tab")[0]
.classList.add("active");

document
.getElementById("loginForm")
.classList.add("active");

}else{

document
.querySelectorAll(".tab")[1]
.classList.add("active");

document
.getElementById("registerForm")
.classList.add("active");

}

document.getElementById("msg").style.display="none";
}

function validUsername(username){

return username.length >= 3;
}

function validPassword(password){

return password.length >= 6;
}

document
.getElementById("registerForm")
.addEventListener(
"submit",
async(e)=>{

e.preventDefault();

const username =
document
.getElementById("regUser")
.value
.trim();

const password =
document
.getElementById("regPass")
.value;

const confirm =
document
.getElementById("regPass2")
.value;

if(!username){

return showMessage(
"Enter username",
"error"
);
}

if(!password){

return showMessage(
"Enter password",
"error"
);
}

if(!confirm){

return showMessage(
"Confirm your password",
"error"
);
}

if(!validUsername(username)){

return showMessage(
"Username must be at least 3 characters",
"error"
);
}

if(!validPassword(password)){

return showMessage(
"Password must be at least 6 characters",
"error"
);
}

if(password!==confirm){

return showMessage(
"Passwords do not match",
"error"
);
}

try{

const res =
await fetch(
`${API}/register?username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`,
{
method:"POST"
}
);

const data =
await res.json();

if(!res.ok){

return showMessage(
data.detail || "Registration failed",
"error"
);

}

showMessage(
"Account created successfully",
"success"
);

switchTab("login");

}catch{

showMessage(
"Server error",
"error"
);

}

});

document
.getElementById("loginForm")
.addEventListener(
"submit",
async(e)=>{

e.preventDefault();

const username =
document
.getElementById("loginUser")
.value
.trim();

const password =
document
.getElementById("loginPass")
.value;

if(!username){

return showMessage(
"Enter username",
"error"
);
}

if(!password){

return showMessage(
"Enter password",
"error"
);
}

try{

const res =
await fetch(
`${API}/login?username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`,
{
method:"POST"
}
);

const data =
await res.json();

if(!res.ok){

return showMessage(
data.detail || "Login failed",
"error"
);

}

localStorage.setItem(
"token",
data.token
);

window.location.href=
"dashboard.html";

}catch{

showMessage(
"Server error",
"error"
);

}

});

</script></body>
  </html>
