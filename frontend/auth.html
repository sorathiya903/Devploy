<style>

/* =====================================
   THEME VARIABLES
===================================== */

:root {
  color-scheme: dark;

  --bg: #000000;
  --surface: #0b0b0b;
  --card: #0d0d0d;
  --elevated: #141414;
  --hover: #1b1b1b;

  --border: #292929;
  --border-soft: #1d1d1d;

  --text: #ffffff;
  --secondary: #a3a3a3;
  --muted: #737373;

  --button-bg: #ffffff;
  --button-text: #000000;

  --input-bg: #080808;
  --input-border: #303030;

  --error-bg: #241313;
  --error-text: #ffb3b3;

  --success-bg: #171717;
  --success-text: #e2e2e2;

  --shadow: rgba(0,0,0,.45);
}

html[data-theme="light"] {
  color-scheme: light;

  --bg: #f5f5f5;
  --surface: #ffffff;
  --card: #ffffff;
  --elevated: #f0f0f0;
  --hover: #e8e8e8;

  --border: #dedede;
  --border-soft: #ebebeb;

  --text: #111111;
  --secondary: #555555;
  --muted: #777777;

  --button-bg: #111111;
  --button-text: #ffffff;

  --input-bg: #fafafa;
  --input-border: #d7d7d7;

  --error-bg: #f8eaea;
  --error-text: #a52a2a;

  --success-bg: #ededed;
  --success-text: #222222;

  --shadow: rgba(0,0,0,.07);
}

/* =====================================
   RESET
===================================== */

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  min-height: 100%;
}

body {
  min-height: 100vh;
  min-height: 100dvh;

  display: flex;
  justify-content: center;
  align-items: center;

  padding: 25px;

  background: var(--bg);
  color: var(--text);

  font-family: 'Geist', sans-serif;

  transition:
    background .25s ease,
    color .25s ease;

  -webkit-font-smoothing: antialiased;
}

/* =====================================
   BACKGROUND
===================================== */

.background-grid {
  position: fixed;
  inset: 0;

  pointer-events: none;

  background-image:
    linear-gradient(
      rgba(128,128,128,.035) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(128,128,128,.035) 1px,
      transparent 1px
    );

  background-size: 45px 45px;

  mask-image:
    linear-gradient(
      to bottom,
      black,
      transparent 85%
    );
}

/* =====================================
   THEME TOGGLE
===================================== */

.theme-toggle {
  position: fixed;
  top: 24px;
  right: 25px;

  width: 43px;
  height: 43px;

  display: grid;
  place-items: center;

  border: 1px solid var(--border);
  border-radius: 12px;

  background: var(--card);
  color: var(--text);

  cursor: pointer;

  font-size: 19px;

  transition:
    background .2s,
    border-color .2s,
    transform .2s;
}

.theme-toggle:hover {
  background: var(--hover);
  transform: translateY(-2px);
}

.theme-toggle:focus-visible {
  outline: 2px solid var(--text);
  outline-offset: 4px;
}

/* =====================================
   MAIN CARD
===================================== */

.card {
  position: relative;
  z-index: 1;

  width: 100%;
  max-width: 430px;

  padding: 37px;

  background: var(--card);

  border: 1px solid var(--border);

  box-shadow:
    0 25px 90px var(--shadow);

  transition:
    background .25s,
    border-color .25s;
}

/* =====================================
   BRAND
===================================== */

.brand {
  display: flex;
  flex-direction: column;
  align-items: center;

  margin-bottom: 32px;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;

  font-size: 27px;
  font-weight: 700;
  letter-spacing: -1.2px;

  color: var(--text);
}

.logo-symbol {
  width: 37px;
  height: 37px;

  display: grid;
  place-items: center;

  border: 1px solid var(--border);
  background: var(--elevated);

  font-family: 'JetBrains Mono', monospace;
  font-size: 17px;
}

.subtitle {
  margin-top: 12px;

  color: var(--muted);

  font-size: 13px;
  text-align: center;
  line-height: 1.7;
}

.brand-label {
  margin-top: 17px;

  color: var(--muted);

  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  letter-spacing: 1.5px;
}

/* =====================================
   TABS
===================================== */

.tabs {
  display: grid;
  grid-template-columns: 1fr 1fr;

  gap: 5px;

  padding: 5px;

  margin-bottom: 27px;

  background: var(--surface);
  border: 1px solid var(--border);
}

.tab {
  padding: 12px;

  border: 0;

  background: transparent;
  color: var(--muted);

  font-family: inherit;
  font-size: 13px;
  font-weight: 600;

  cursor: pointer;

  transition:
    background .2s,
    color .2s;
}

.tab:hover {
  color: var(--text);
}

.tab.active {
  background: var(--elevated);
  color: var(--text);

  outline: 1px solid var(--border);
}

/* =====================================
   FORMS
===================================== */

.form {
  display: none;
}

.form.active {
  display: block;
  animation: formEnter .3s ease;
}

@keyframes formEnter {
  from {
    opacity: 0;
    transform: translateY(7px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

label {
  display: block;

  margin-bottom: 8px;

  color: var(--secondary);

  font-size: 12px;
  font-weight: 600;
}

input {
  width: 100%;
  height: 48px;

  padding: 0 14px;

  margin-bottom: 19px;

  border: 1px solid var(--input-border);

  background: var(--input-bg);
  color: var(--text);

  border-radius: 0;

  font-family: inherit;
  font-size: 13px;

  outline: none;

  transition:
    border-color .2s,
    background .2s,
    box-shadow .2s;
}

input::placeholder {
  color: var(--muted);
}

input:focus {
  border-color: var(--text);
  box-shadow: 0 0 0 2px rgba(128,128,128,.13);
}

/* =====================================
   SUBMIT BUTTON
===================================== */

.btn {
  width: 100%;
  height: 49px;

  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;

  border: 1px solid var(--button-bg);

  background: var(--button-bg);
  color: var(--button-text);

  font-family: inherit;
  font-size: 13px;
  font-weight: 700;

  cursor: pointer;

  transition:
    transform .2s,
    opacity .2s;
}

.btn:hover {
  opacity: .88;
  transform: translateY(-2px);
}

.btn:active {
  transform: translateY(0);
}

.btn:focus-visible {
  outline: 2px solid var(--text);
  outline-offset: 4px;
}

/* =====================================
   MESSAGES
===================================== */

.message {
  display: none;

  padding: 13px 14px;

  margin-bottom: 19px;

  border: 1px solid var(--border);

  font-size: 12px;
  line-height: 1.6;
}

.error {
  background: var(--error-bg);
  color: var(--error-text);
}

.success {
  background: var(--success-bg);
  color: var(--success-text);
}

/* =====================================
   EXTRA TEXT
===================================== */

.small {
  margin-top: 17px;

  color: var(--muted);

  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;

  text-align: center;
}

.card-footer {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;

  margin-top: 30px;
  padding-top: 20px;

  border-top: 1px solid var(--border-soft);

  color: var(--muted);

  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  letter-spacing: .5px;
}

.footer-dot {
  width: 5px;
  height: 5px;

  background: var(--secondary);
  border-radius: 50%;
}

/* =====================================
   LOADING
===================================== */

.loading {
  opacity: .6;
  pointer-events: none;
}

/* =====================================
   RESPONSIVE
===================================== */

@media(max-width: 500px) {

  body {
    padding: 18px;
    align-items: center;
  }

  .card {
    padding: 27px 21px;
  }

  .theme-toggle {
    top: 15px;
    right: 15px;
  }

  .logo {
    font-size: 25px;
  }

}

@media(prefers-reduced-motion: reduce) {

  *,
  *::before,
  *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }

}

</style>
</head>

<!-- THEME MANAGEMENT
     Separate from existing authentication JS.
-->

<script>

(function () {

  const html = document.documentElement;
  const toggle = document.getElementById("themeToggle");

  // Restore saved theme.
  // Dark is the default.

  const savedTheme = localStorage.getItem("devployz-theme");

  function applyTheme(theme) {

    html.setAttribute("data-theme", theme);

    localStorage.setItem("devployz-theme", theme);

    if (theme === "light") {

      toggle.textContent = "☾";

      toggle.setAttribute(
        "aria-label",
        "Switch to dark theme"
      );

    } else {

      toggle.textContent = "☀";

      toggle.setAttribute(
        "aria-label",
        "Switch to light theme"
      );

    }

    document
      .querySelector('meta[name="theme-color"]')
      .setAttribute(
        "content",
        theme === "light" ? "#f5f5f5" : "#000000"
      );

  }

  applyTheme(
    savedTheme === "light" ? "light" : "dark"
  );

  toggle.addEventListener("click", function () {

    const currentTheme =
      html.getAttribute("data-theme");

    const newTheme =
      currentTheme === "dark" ? "light" : "dark";

    applyTheme(newTheme);

  });

})();

</script>


<!-- ORIGINAL AUTHENTICATION JAVASCRIPT
     PRESERVED WITHOUT CHANGES
-->

<script>

const API =
"https://devploy.onrender.com";

function showMessage(
text,
type
){

const msg =
document.getElementById("msg");

msg.style.display="block";

msg.className=
`message ${type}`;

msg.textContent=text;
}

function switchTab(tab){

document
.querySelectorAll(".tab")
.forEach(t=>t.classList.remove("active"));

document
.querySelectorAll(".form")
.forEach(f=>f.classList.remove("active"));

if(tab==="login"){

document
.querySelectorAll(".tab")[0]
.classList.add("active");

document
.getElementById("loginForm")
.classList.add("active");

}else{

document
.querySelectorAll(".tab")[1]
.classList.add("active");

document
.getElementById("registerForm")
.classList.add("active");

}

document.getElementById("msg").style.display="none";
}

function validUsername(username){

return username.length >= 3;
}

function validPassword(password){

return password.length >= 6;
}

document
.getElementById("registerForm")
.addEventListener(
"submit",
async(e)=>{

e.preventDefault();

const username =
document
.getElementById("regUser")
.value
.trim();

const password =
document
.getElementById("regPass")
.value;

const confirm =
document
.getElementById("regPass2")
.value;

if(!username){

return showMessage(
"Enter username",
"error"
);
}

if(!password){

return showMessage(
"Enter password",
"error"
);
}

if(!confirm){

return showMessage(
"Confirm your password",
"error"
);
}

if(!validUsername(username)){

return showMessage(
"Username must be at least 3 characters",
"error"
);
}

if(!validPassword(password)){

return showMessage(
"Password must be at least 6 characters",
"error"
);
}

if(password!==confirm){

return showMessage(
"Passwords do not match",
"error"
);
}

try{

const res =
await fetch(
`${API}/register?username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`,
{
method:"POST"
}
);

const data =
await res.json();

if(!res.ok){

return showMessage(
data.detail || "Registration failed",
"error"
);

}

showMessage(
"Account created successfully",
"success"
);

switchTab("login");

}catch{

showMessage(
"Server error",
"error"
);

}

});

document
.getElementById("loginForm")
.addEventListener(
"submit",
async(e)=>{

e.preventDefault();

const username =
document
.getElementById("loginUser")
.value
.trim();

const password =
document
.getElementById("loginPass")
.value;

if(!username){

return showMessage(
"Enter username",
"error"
);
}

if(!password){

return showMessage(
"Enter password",
"error"
);
}

try{

const res =
await fetch(
`${API}/login?username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`,
{
method:"POST"
}
);

const data =
await res.json();

if(!res.ok){

return showMessage(
data.detail || "Login failed",
"error"
);

}

localStorage.setItem(
"token",
data.token
);

window.location.href=
"dashboard.html";

}catch{

showMessage(
"Server error",
"error"
);

}

});

</script>
