<script>

  async function loadProjects() {

  const res = await fetch(`${API}/my-projects`, {
    headers: {
      Authorization: `Bearer ${token}`
    }
  });

  if (!res.ok) {
    console.error("Failed to load projects");
    return;
  }

  const projects = await res.json();

  const container = document.getElementById("projectsContainer");

  if (!projects.length) {
    container.innerHTML = `
      <div class="empty">
        <h3>No Projects Yet</h3>
        <p>Create your first deployment.</p>
      </div>
    `;
    return;
  }

  container.innerHTML = `
    <div class="grid">
      ${projects.map(p => `
        <div class="card"
          onclick="openProject('${p.name}')"
          style="cursor:pointer">

          <h3>${p.name}</h3>

          <div class="meta">
            Status: ${p.status}
          </div>

          <div class="meta">
            ${p.url}
          </div>

          <button
            class="delete-btn"
            onclick="event.stopPropagation(); deleteProject('${p.name}', this)">
            Delete Project
          </button>

        </div>
      `).join("")}
    </div>
  `;
}
  function toggleFrameworkSettings(){

  const type = document.getElementById("deployType").value;
  const frameworkSettings = document.getElementById("frameworkSettings");
  const autoDeploy = document.getElementById("autoDeploy");
  const autoDeployLabel = document.getElementById("autoDeployLabel");

  frameworkSettings.style.display =
    type === "framework" ? "block" : "none";

  autoDeploy.disabled = type === "framework";

  autoDeployLabel.style.opacity =
    type === "framework" ? "0.5" : "1";

  if(type === "framework"){
    autoDeploy.checked = false;
  }
}


async function inspectSelectedRepo(){

  const select = document.getElementById("repoSelect");
  const option = select.options[select.selectedIndex];

  if(!option) return;

  const fullName = option.dataset.fullName;
  const branch = option.dataset.branch;

  const detection = document.getElementById("frameworkDetection");

  detection.innerText = "Detecting project framework...";

  try {

    const url =
      `https://raw.githubusercontent.com/${fullName}/${encodeURIComponent(branch)}/package.json`;

    const res = await fetch(url);

    if(!res.ok){
      detection.innerText =
        "No readable package.json found. You can still configure a framework build manually.";

      return;
    }

    const pkg = await res.json();

    const dependencies = {
      ...(pkg.dependencies || {}),
      ...(pkg.devDependencies || {})
    };

    const scripts = pkg.scripts || {};

    let framework = "Unknown";
    let output = "dist";

    if(dependencies["vite"]){
      framework = "Vite";
      output = "dist";
    }
    else if(dependencies["react-scripts"]){
      framework = "Create React App";
      output = "build";
    }
    else if(dependencies["@angular/cli"]){
      framework = "Angular";
      output = "dist";
    }
    else if(dependencies["next"]){
      framework = "Next.js";
      output = "out";
    }
    else if(dependencies["vue"]){
      framework = "Vue";
      output = "dist";
    }
    else if(dependencies["svelte"] || dependencies["@sveltejs/kit"]){
      framework = "Svelte";
      output = "build";
    }
    else if(scripts.build){
      framework = "JavaScript project";
    }

    document.getElementById("installCommand").value =
      pkg.packageManager?.startsWith("pnpm") ? "pnpm install" :
      pkg.packageManager?.startsWith("yarn") ? "yarn install" :
      "npm install";

    document.getElementById("buildCommand").value =
      scripts.build ? "npm run build" : "";

    document.getElementById("outputDir").value = output;

    detection.innerText =
      `Detected: ${framework}. Review the build settings before deploying.`;

    // Suggest framework build when a build script exists.
    if(scripts.build){
      document.getElementById("deployType").value = "framework";
    } else {
      document.getElementById("deployType").value = "static";
    }

    toggleFrameworkSettings();

  } catch(err){

    console.error("Framework detection failed:", err);

    detection.innerText =
      "Could not detect framework. You can configure the build settings manually.";
  }
}
const token = localStorage.getItem("token");

`${API}/github/status`,
{
headers:{
Authorization:`Bearer ${token}`
}
}
);

const data = await res.json();

if(data.connected){

async function loadGithubRepos(){

  const res = await fetch(`${API}/github/repos`, {
    headers: {
      Authorization: `Bearer ${token}`
    }
  });

  if(!res.ok) return;

  const repos = await res.json();
  const select = document.getElementById("repoSelect");

  select.innerHTML = "";

  repos.forEach(repo => {
    const option = document.createElement("option");

    option.value = repo.clone_url;
    option.textContent = repo.full_name;

    option.dataset.fullName = repo.full_name;
    option.dataset.branch = repo.default_branch || "main";

    select.appendChild(option);
  });

  select.style.display = "block";

  document.getElementById("connectGithubBtn").style.display = "none";

  select.onchange = inspectSelectedRepo;

  if(repos.length){
    await inspectSelectedRepo();
  }
}
function toggleMenu() {
  const m = document.getElementById("menu");
  m.style.display = (m.style.display === "block") ? "none" : "block";
}

function showProjects() {
  document.getElementById("projectsView").style.display = "block";
  document.getElementById("createView").style.display = "none";
  document.getElementById("menu").style.display = "none";
}

function showCreate() {
  document.getElementById("projectsView").style.display = "none";
  document.getElementById("createView").style.display = "block";
  document.getElementById("menu").style.display = "none";

  document.getElementById("logBox").style.display = "none";
  document.getElementById("logs").innerHTML = "";
}


/* ================= WEBSOCKET LOGS ================= */

let socket;
const API = "https://devploy.onrender.com";

function connectLogs(project) {
console.log("Connecting ws...")
  if (socket) socket.close();

  document.getElementById("logBox").style.display = "block";
  document.getElementById("logs").innerHTML = "";

  socket = new WebSocket(`wss://devploy.onrender.com/ws/deploy/${project}`);
socket.onclose = () => {
  setTimeout(() => connectLogs(project), 2000);
};
  socket.onmessage = (event) => {
    
    const data = JSON.parse(event.data);
console.log("data arrived ")
    console.log(data)
    const div = document.createElement("div");
    div.style.padding = "10px";
    div.style.margin = "6px 0";
    div.style.borderLeft = "4px solid #2563eb";
    div.style.background = "#e5e7eb";
    div.style.fontWeight = "600";
    div.innerText = data.msg;

    document.getElementById("logs").appendChild(div);
  };
}


/* ================= DEPLOY ================= */
async function deploy() {

  const projectName =
    document.getElementById("projectName").value.trim();

  const repoUrl =
    document.getElementById("repoSelect").value.trim();

  const baseDir =
    document.getElementById("baseDir").value.trim();

  const deployType =
    document.getElementById("deployType").value;

  if(!projectName || !repoUrl){
    alert("Select a repository and enter a project name");
    return;
  }

  const btn = document.getElementById("deployBtn");

  btn.disabled = true;
  btn.innerText = "Starting deployment...";

  try {

    let endpoint;
    let body;

    if(deployType === "framework"){

      const installCommand =
        document.getElementById("installCommand").value.trim();

      const buildCommand =
        document.getElementById("buildCommand").value.trim();

      const outputDir =
        document.getElementById("outputDir").value.trim();

      if(!installCommand || !buildCommand || !outputDir){
        throw new Error("Fill in all framework build settings");
      }

      endpoint = `${API}/deploy/framework`;

      body = {
        project_name: projectName,
        repo_url: repoUrl,
        base_dir: baseDir,
        install_command: installCommand,
        build_command: buildCommand,
        output_dir: outputDir
      };

    } else {

      // Existing static deployment request — unchanged.
      endpoint = `${API}/deploy`;

      body = {
        project_name: projectName,
        repo_url: repoUrl,
        base_dir: baseDir,
        auto_deploy: document.getElementById("autoDeploy").checked
      };
    }

    const res = await fetch(endpoint, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${token}`
      },
      body: JSON.stringify(body)
    });

    const data = await res.json();

    if(!res.ok){
      throw new Error(
        data.detail || data.error || "Deployment failed"
      );
    }

    document.getElementById("result").style.display = "block";

    document.getElementById("result").innerText =
      deployType === "framework"
        ? "Framework build started! Waiting for GitHub Actions..."
        : "Static deployment started!";

    connectLogs(data.project);

    loadProjects();

  } catch(err) {

    alert(err.message);
    console.error(err);

  } finally {

    btn.disabled = false;
    btn.innerText = "Deploy Project";

  }
}
/* ================= AUTH + PROJECTS ================= */

function openProject(project){

    localStorage.setItem(
        "selectedProject",
        project
    );

    location.href =
        "project.html";
}

if (!token) location.href = "auth.html";

async function getMe() {
  const res = await fetch(`${API}/me`, {
    headers: { Authorization: `Bearer ${token}` }
  });

  const user = await res.json();
  document.getElementById("username").innerText = user.username;
}

async function deleteProject(projectName, button) {

  const confirmed = confirm(
    `Are you sure you want to delete "${projectName}"?\n\n` +
    "All deployments and stored project files will be permanently deleted."
  );

  if (!confirmed) return;

  button.disabled = true;
  button.innerText = "Deleting...";

  try {

    const response = await fetch(
      `${API}/project/${encodeURIComponent(projectName)}`,
      {
        method: "DELETE",
        headers: {
          Authorization: `Bearer ${token}`
        }
      }
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.detail || "Failed to delete project"
      );
    }

    alert("Project deleted successfully!");

    // Refresh project cards
    await loadProjects();

  } catch (error) {

    console.error("Delete project error:", error);

    alert(error.message);

    button.disabled = false;
    button.innerText = "Delete Project";

  }
}

/* ================= LOGOUT ================= */

function logout() {
  localStorage.removeItem("token");
  location.href = "auth.html";
}


/* INIT */

getMe();
loadProjects();
checkGithub();
  toggleFrameworkSettings()
</script>
