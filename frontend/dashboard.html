<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Devploy Dashboard</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>

<script>

if(
  location.hostname === "localhost" ||

  location.hostname.includes("127.0.0.1") ||

  location.hostname.includes("netlify") ||

  localStorage.getItem("debug") === "true"
){

  eruda.init();

}

</script>
  <style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}

body{
background:#f5f9ff;
color:#111827;
}

header{
background:white;
padding:18px 30px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 2px 10px rgba(0,0,0,.05);
position:sticky;
top:0;
z-index:100;
}

.logo{
font-size:28px;
font-weight:700;
color:#2563eb;
}

.right{
display:flex;
gap:12px;
align-items:center;
}

.username{
font-weight:600;
}

.logout{
border:none;
background:#ef4444;
color:white;
padding:10px 16px;
border-radius:10px;
cursor:pointer;
}

.container{
max-width:1200px;
margin:auto;
padding:30px 20px;
}

.hero{
background:white;
padding:25px;
border-radius:18px;
margin-bottom:25px;
box-shadow:0 5px 20px rgba(0,0,0,.05);
}

.hero h2{
margin-bottom:8px;
}

.hero p{
color:#6b7280;
}

.deploy-box{
background:white;
padding:25px;
border-radius:18px;
box-shadow:0 5px 20px rgba(0,0,0,.05);
margin-bottom:25px;
}

.deploy-box h3{
margin-bottom:15px;
}

input{
width:100%;
padding:14px;
border:1px solid #dbe3f0;
border-radius:12px;
margin-bottom:15px;
outline:none;
}

input:focus{
border-color:#2563eb;
}

.deploy-btn{
background:#2563eb;
color:white;
border:none;
padding:14px;
width:100%;
border-radius:12px;
font-weight:600;
cursor:pointer;
}

.deploy-btn:disabled{
opacity:.6;
cursor:not-allowed;
}

.result{
margin-top:15px;
display:none;
padding:14px;
border-radius:12px;
background:#eaf3ff;
word-break:break-all;
}

.section-title{
font-size:22px;
font-weight:700;
margin-bottom:20px;
}

.empty{
background:white;
padding:40px;
border-radius:18px;
text-align:center;
box-shadow:0 5px 20px rgba(0,0,0,.05);
}

.empty h3{
margin-bottom:8px;
}

.empty p{
color:#6b7280;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
gap:20px;
}

.card{
background:white;
padding:20px;
border-radius:18px;
box-shadow:0 5px 20px rgba(0,0,0,.05);
}

.card h3{
margin-bottom:10px;
}

.meta{
font-size:14px;
color:#6b7280;
margin-bottom:8px;
}

.actions{
display:flex;
gap:10px;
margin-top:15px;
}

.open{
flex:1;
text-decoration:none;
background:#2563eb;
color:white;
padding:10px;
text-align:center;
border-radius:10px;
}

.copy{
flex:1;
border:none;
background:#e5e7eb;
padding:10px;
border-radius:10px;
cursor:pointer;
}

    .log-line{
  background:#f3f4f6;
  color:#111827;
  padding:10px;
  margin:6px 0;
  border-radius:10px;
  font-weight:600;
  border-left:4px solid red
  }

</style></head>
<body>

<header>
  <div class="logo">Devploy</div>

  <div class="right">
    <span id="username" class="username">Loading...</span>

    <!-- MORE BUTTON -->
    <button onclick="toggleMenu()" style="font-size:20px;background:none;border:none;cursor:pointer;">
      ⋮
    </button>

    <div id="menu" style="
    display: none; 
    position: absolute; 
    right: 20px; 
    top: 60px; 
    background: #ffffff; 
    padding: 8px; 
    border-radius: 12px; 
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
    border: 1px solid rgba(0, 0, 0, 0.05);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    min-width: 160px;
">
    <button onclick="showCreate()" style="
        display: block;
        width: 100%;
        text-align: left;
        background: none;
        border: none;
        padding: 10px 12px;
        font-size: 14px;
        color: #1f2937;
        border-radius: 6px;
        cursor: pointer;
        transition: background 0.2s;
    " onmouseover="this.style.background='#f3f4f6'" onmouseout="this.style.background='none'">
        New Project
    </button>
    
    <button onclick="showProjects()" style="
        display: block;
        width: 100%;
        text-align: left;
        background: none;
        border: none;
        padding: 10px 12px;
        font-size: 14px;
        color: #1f2937;
        border-radius: 6px;
        cursor: pointer;
        transition: background 0.2s;
    " onmouseover="this.style.background='#f3f4f6'" onmouseout="this.style.background='none'">
        Show Projects
    </button>

    <hr style="
        border: 0;
        height: 1px;
        background: #e5e7eb;
        margin: 6px 4px;
    ">
    
    <button onclick="logout()" style="
        display: block;
        width: 100%;
        text-align: left;
        background: none;
        border: none;
        padding: 10px 12px;
        font-size: 14px;
        color: #dc2626;
        border-radius: 6px;
        cursor: pointer;
        transition: background 0.2s;
    " onmouseover="this.style.background='#fef2f2'" onmouseout="this.style.background='none'">
        Logout
    </button>
</div>

  </div>
</header>


<div class="container">

  <!-- ================= PROJECTS VIEW ================= -->
  <div id="projectsView">

    <h2 class="section-title">Your Projects</h2>

    <div id="projectsContainer"></div>

  </div>


  <!-- ================= CREATE PROJECT VIEW ================= -->
  <div id="createView" style="display:none;">

    <div class="deploy-box">
      <h3>Create New Project</h3>

      <input id="projectName" placeholder="Project Name">
    <button
id="connectGithubBtn"
class="deploy-btn"
onclick="connectGithub()">

Connect GitHub

</button>

<select
id="repoSelect"
style="
width:100%;
padding:14px;
border:1px solid #dbe3f0;
border-radius:12px;
margin-bottom:15px;
display:none;
">
</select>

      <div class="form-group">
        <input type="text" id="baseDir" placeholder="Base Directory: frontend">
        <small>
          Optional. Leave empty if index.html is in root.
        </small>
      </div>

      <button id="deployBtn" onclick="deploy()" class="deploy-btn">
        Deploy Project
      </button>

      <div id="result" class="result"></div>
    </div>

    <!-- LOG BOX -->
    <div id="logBox"
      style="display:none;margin-top:20px;padding:15px;border-radius:12px;background:#f3f4f6;">
      <h3>Deployment Logs</h3>
      <div id="logs"></div>
    </div>

  </div>

</div>


<script>
const token = localStorage.getItem("token");

  
function connectGithub(){

location.href=
"https://github.com/login/oauth/authorize"+
"?client_id=YOUR_CLIENT_ID"+
"&scope=repo";

}


async function loadGithubRepos(){

const res = await fetch(
`${API}/github/repos`,
{
headers:{
Authorization:`Bearer ${token}`
}
}
);

if(!res.ok){
return;
}

const repos = await res.json();

const select =
document.getElementById("repoSelect");

select.style.display = "block";

select.innerHTML =
repos.map(repo=>`
<option
value="${repo.clone_url}">
${repo.full_name}
</option>
`).join("");

document.getElementById(
"connectGithubBtn"
).style.display="none";

}
  
function toggleMenu() {
  const m = document.getElementById("menu");
  m.style.display = (m.style.display === "block") ? "none" : "block";
}

function showProjects() {
  document.getElementById("projectsView").style.display = "block";
  document.getElementById("createView").style.display = "none";
  document.getElementById("menu").style.display = "none";
}

function showCreate() {
  document.getElementById("projectsView").style.display = "none";
  document.getElementById("createView").style.display = "block";
  document.getElementById("menu").style.display = "none";

  document.getElementById("logBox").style.display = "none";
  document.getElementById("logs").innerHTML = "";
}


/* ================= WEBSOCKET LOGS ================= */

let socket;
const API = "https://devploy.onrender.com";

function connectLogs(project) {
console.log("Connecting ws...")
  if (socket) socket.close();

  document.getElementById("logBox").style.display = "block";
  document.getElementById("logs").innerHTML = "";

  socket = new WebSocket(`wss://devploy.onrender.com/ws/deploy/${project}`);
socket.onclose = () => {
  setTimeout(() => connectLogs(project), 2000);
};
  socket.onmessage = (event) => {
    
    const data = JSON.parse(event.data);
console.log("data arrived ")
    console.log(data)
    const div = document.createElement("div");
    div.style.padding = "10px";
    div.style.margin = "6px 0";
    div.style.borderLeft = "4px solid #2563eb";
    div.style.background = "#e5e7eb";
    div.style.fontWeight = "600";
    div.innerText = data.msg;

    document.getElementById("logs").appendChild(div);
  };
}


/* ================= DEPLOY ================= */

async function deploy() {

  const projectName = document.getElementById("projectName").value.trim();
  const repoUrl = document.getElementById("repoSelect").value.trim();
  const baseDir = document.getElementById("baseDir").value.trim();

  if(!projectName || !repoUrl){
alert("Select repository");
return;
  }

  const btn = document.getElementById("deployBtn");
  btn.disabled = true;
  btn.innerText = "Deploying...";

  try {

    

    const res = await fetch("https://devploy.onrender.com/deploy", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${localStorage.getItem("token")}`
      },
      body: JSON.stringify({
        project_name: projectName,
        repo_url: repoUrl,
        base_dir: baseDir
      })
    });

    const data = await res.json();

    if (!res.ok) throw new Error(data.error || "Deploy failed");

    connectLogs(data.project)

    loadProjects();

  } catch (err) {
    alert(err.message);
  }

  btn.disabled = false;
  btn.innerText = "Deploy Project";
}


/* ================= AUTH + PROJECTS ================= */

function openProject(project){

    localStorage.setItem(
        "selectedProject",
        project
    );

    location.href =
        "project.html";
}

if (!token) location.href = "auth.html";

async function getMe() {
  const res = await fetch(`${API}/me`, {
    headers: { Authorization: `Bearer ${token}` }
  });

  const user = await res.json();
  document.getElementById("username").innerText = user.username;
}

async function loadProjects() {

  const res = await fetch(`${API}/my-projects`, {
    headers: { Authorization: `Bearer ${token}` }
  });

  const projects = await res.json();

  const container = document.getElementById("projectsContainer");

  if (!projects.length) {
    container.innerHTML = `
      <div class="empty">
        <h3>No Projects Yet</h3>
        <p>Create your first deployment.</p>
      </div>
    `;
    return;
  }

  container.innerHTML = `
    <div class="grid">
      ${projects.map(p => `
      <div class="card"  onclick="location.href='project.html?project=${p.name}'">
          <h3>${p.name}</h3>
          <div class="meta">Status: ${p.status}</div>
          <div class="meta">${p.url}</div>
        </div>
      `).join("")}
    </div>
  `;
}


/* ================= LOGOUT ================= */

function logout() {
  localStorage.removeItem("token");
  location.href = "auth.html";
}


/* INIT */

getMe();
loadProjects();
loadGithubRepos()
</script>

</body>


  </html>
