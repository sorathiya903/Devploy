<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Devploy Dashboard</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>

<script>

if(
  location.hostname === "localhost" ||

  location.hostname.includes("127.0.0.1") ||

  location.hostname.includes("netlify") ||

  localStorage.getItem("debug") === "true"
){

  eruda.init();

}

</script>
  <style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}

body{
background:#f5f9ff;
color:#111827;
}

header{
background:white;
padding:18px 30px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 2px 10px rgba(0,0,0,.05);
position:sticky;
top:0;
z-index:100;
}

.logo{
font-size:28px;
font-weight:700;
color:#2563eb;
}

.right{
display:flex;
gap:12px;
align-items:center;
}

.username{
font-weight:600;
}

.logout{
border:none;
background:#ef4444;
color:white;
padding:10px 16px;
border-radius:10px;
cursor:pointer;
}

.container{
max-width:1200px;
margin:auto;
padding:30px 20px;
}

.hero{
background:white;
padding:25px;
border-radius:18px;
margin-bottom:25px;
box-shadow:0 5px 20px rgba(0,0,0,.05);
}

.hero h2{
margin-bottom:8px;
}

.hero p{
color:#6b7280;
}

.deploy-box{
background:white;
padding:25px;
border-radius:18px;
box-shadow:0 5px 20px rgba(0,0,0,.05);
margin-bottom:25px;
}

.deploy-box h3{
margin-bottom:15px;
}

input{
width:100%;
padding:14px;
border:1px solid #dbe3f0;
border-radius:12px;
margin-bottom:15px;
outline:none;
}

input:focus{
border-color:#2563eb;
}

.deploy-btn{
background:#2563eb;
color:white;
border:none;
padding:14px;
width:100%;
border-radius:12px;
font-weight:600;
cursor:pointer;
}

.deploy-btn:disabled{
opacity:.6;
cursor:not-allowed;
}

.result{
margin-top:15px;
display:none;
padding:14px;
border-radius:12px;
background:#eaf3ff;
word-break:break-all;
}

.section-title{
font-size:22px;
font-weight:700;
margin-bottom:20px;
}

.empty{
background:white;
padding:40px;
border-radius:18px;
text-align:center;
box-shadow:0 5px 20px rgba(0,0,0,.05);
}

.empty h3{
margin-bottom:8px;
}

.empty p{
color:#6b7280;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
gap:20px;
}

.card{
background:white;
padding:20px;
border-radius:18px;
box-shadow:0 5px 20px rgba(0,0,0,.05);
}

.card h3{
margin-bottom:10px;
}

.meta{
font-size:14px;
color:#6b7280;
margin-bottom:8px;
}

.actions{
display:flex;
gap:10px;
margin-top:15px;
}

.open{
flex:1;
text-decoration:none;
background:#2563eb;
color:white;
padding:10px;
text-align:center;
border-radius:10px;
}

.copy{
flex:1;
border:none;
background:#e5e7eb;
padding:10px;
border-radius:10px;
cursor:pointer;
}

</style></head>
<body><header><div class="logo">Devploy</div><div class="right">
<span id="username" class="username">Loading...</span><button class="logout" onclick="logout()">
Logout
</button>
</div></header><div class="container"><div class="hero">
<h2>Dashboard</h2>
<p>Manage and deploy your projects.</p>
</div><div class="deploy-box"><h3>Create New Project</h3><input
id="projectName"
placeholder="Project Name">

<input
id="repoUrl"
placeholder="GitHub Repository URL">

<button
id="deployBtn"
class="deploy-btn">
Deploy Project
</button>

<div
id="result"
class="result">
</div></div><h2 class="section-title">
Your Projects
</h2><div id="projectsContainer">
</div></div><script>

const API =
"https://devploy.onrender.com";

const token =
localStorage.getItem("token");

if(!token){

location.href="auth.html";

}

async function getMe(){

const res =
await fetch(
`${API}/me`,
{
headers:{
Authorization:
`Bearer ${token}`
}
}
);

if(!res.ok){

logout();
return;

}

const user =
await res.json();

document.getElementById(
"username"
).textContent =
user.username;

}

async function loadProjects(){

const res =
await fetch(
`${API}/my-projects`,
{
headers:{
Authorization:
`Bearer ${token}`
}
}
);

if(!res.ok){

logout();
return;

}

const projects =
await res.json();

const container =
document.getElementById(
"projectsContainer"
);

if(!projects.length){

container.innerHTML=
`
<div class="empty">
<h3>No Projects Yet</h3>
<p>Create your first deployment above.</p>
</div>
`;

return;

}

container.innerHTML=
`
<div class="grid">
${projects.map(project=>`
<div class="card">

<h3>${project.name}</h3>

<div class="meta">
Status: ${project.status}
</div>

<div class="meta">
${project.url}
</div>

<div class="actions">

<a
class="open"
href="${project.url}"
target="_blank">
Open
</a>

<button
class="copy"
onclick="copyUrl('${project.url}')">
Copy URL
</button>

</div>

</div>
`).join("")}
</div>
`;

}

function copyUrl(url){

navigator.clipboard.writeText(url);

}

async function deploy(){

const projectName =
document
.getElementById(
"projectName"
)
.value
.trim();

const repoUrl =
document
.getElementById(
"repoUrl"
)
.value
.trim();

if(!projectName){

alert(
"Enter project name"
);

return;
}

if(!repoUrl){

alert(
"Enter repository URL"
);

return;
}

if(
!repoUrl.includes(
"github.com"
)
){

alert(
"Enter a valid GitHub URL"
);

return;
}

const btn =
document.getElementById(
"deployBtn"
);

btn.disabled=true;
btn.textContent=
"Deploying...";

try{

const res =
await fetch(
`${API}/deploy?project_name=${encodeURIComponent(projectName)}&repo_url=${encodeURIComponent(repoUrl)}`,
{
method:"POST",
headers:{
Authorization:
`Bearer ${token}`
}
}
);

const data =
await res.json();

if(!res.ok){

throw new Error(
data.detail ||
"Deploy failed"
);

}

const result =
document.getElementById(
"result"
);

result.style.display=
"block";

result.innerHTML=
`
<b>Deployment Successful</b>
<br><br>
<a href="${data.url}" target="_blank">
${data.url}
</a>
`;

loadProjects();

}catch(err){

alert(
err.message
);

}

btn.disabled=false;
btn.textContent=
"Deploy Project";

}

document
.getElementById(
"deployBtn"
)
.addEventListener(
"click",
deploy
);

function logout(){

localStorage.removeItem(
"token"
);

location.href=
"auth.html";

}

getMe();
loadProjects();

</script></body>
  </html>
