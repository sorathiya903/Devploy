<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Devploy Dashboard</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>

<script>

if(
  location.hostname === "localhost" ||

  location.hostname.includes("127.0.0.1") ||

  location.hostname.includes("netlify") ||

  localStorage.getItem("debug") === "true"
){

  eruda.init();

}

</script>
  <style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}

body{
background:#f5f9ff;
color:#111827;
}

header{
background:white;
padding:18px 30px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 2px 10px rgba(0,0,0,.05);
position:sticky;
top:0;
z-index:100;
}

.logo{
font-size:28px;
font-weight:700;
color:#2563eb;
}

.right{
display:flex;
gap:12px;
align-items:center;
}

.username{
font-weight:600;
}

.logout{
border:none;
background:#ef4444;
color:white;
padding:10px 16px;
border-radius:10px;
cursor:pointer;
}

.container{
max-width:1200px;
margin:auto;
padding:30px 20px;
}

.hero{
background:white;
padding:25px;
border-radius:18px;
margin-bottom:25px;
box-shadow:0 5px 20px rgba(0,0,0,.05);
}

.hero h2{
margin-bottom:8px;
}

.hero p{
color:#6b7280;
}

.deploy-box{
background:white;
padding:25px;
border-radius:18px;
box-shadow:0 5px 20px rgba(0,0,0,.05);
margin-bottom:25px;
}

.deploy-box h3{
margin-bottom:15px;
}

input{
width:100%;
padding:14px;
border:1px solid #dbe3f0;
border-radius:12px;
margin-bottom:15px;
outline:none;
}

input:focus{
border-color:#2563eb;
}

.deploy-btn{
background:#2563eb;
color:white;
border:none;
padding:14px;
width:100%;
border-radius:12px;
font-weight:600;
cursor:pointer;
}

.deploy-btn:disabled{
opacity:.6;
cursor:not-allowed;
}

.result{
margin-top:15px;
display:none;
padding:14px;
border-radius:12px;
background:#eaf3ff;
word-break:break-all;
}

.section-title{
font-size:22px;
font-weight:700;
margin-bottom:20px;
}

.empty{
background:white;
padding:40px;
border-radius:18px;
text-align:center;
box-shadow:0 5px 20px rgba(0,0,0,.05);
}

.empty h3{
margin-bottom:8px;
}

.empty p{
color:#6b7280;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
gap:20px;
}

.card{
background:white;
padding:20px;
border-radius:18px;
box-shadow:0 5px 20px rgba(0,0,0,.05);
}

.card h3{
margin-bottom:10px;
}

.meta{
font-size:14px;
color:#6b7280;
margin-bottom:8px;
}

.actions{
display:flex;
gap:10px;
margin-top:15px;
}

.open{
flex:1;
text-decoration:none;
background:#2563eb;
color:white;
padding:10px;
text-align:center;
border-radius:10px;
}

.copy{
flex:1;
border:none;
background:#e5e7eb;
padding:10px;
border-radius:10px;
cursor:pointer;
}

    .log-line{
  background:#f3f4f6;
  color:#111827;
  padding:10px;
  margin:6px 0;
  border-radius:10px;
  font-weight:600;
  border-left:4px solid #2563eb;
  }

</style></head>
<body><header><div class="logo">Devploy</div>
  
  <div class="right">
  <span id="username" class="username">Loading...</span>

  <button onclick="toggleMenu()">☰</button>

  <div id="menu" style="display:none; position:absolute; right:20px; top:60px; background:white; padding:10px; border-radius:10px; box-shadow:0 5px 20px rgba(0,0,0,.1)">
    <button onclick="showCreate()">New Project</button>
    <button onclick="logout()">Logout</button>
  </div>
  </div>
  </header><div class="container">
  
  
  <div class="deploy-box"><h3>Create New Project</h3><input
id="projectName"
placeholder="Project Name">

<input
id="repoUrl"
placeholder="GitHub Repository URL">
<div class="form-group">
  
  <input
    type="text"
    id="baseDir"
    placeholder="Base Directory: frontend"
  >
  <small>
    Optional. Leave empty if index.html is in the repository root.
    Example: frontend, website, apps/web
  </small>
</div>
<button
id="deployBtn"
class="deploy-btn">
Deploy Project
</button>

<div
id="result"
class="result">
</div></div>
    
    <div id="logBox" style="display:none; margin-top:20px; padding:15px; background:#f3f4f6; border-radius:12px;">
  <h3>Deployment Logs</h3>
  <div id="logs"></div>
    </div>

    
    <h2 class="section-title">
Your Projects
</h2><div id="projectsContainer">
</div></div>
  
  
  <script>

function showCreate(){
  document.getElementById("projectsContainer").style.display="none";
  document.querySelector(".deploy-box").style.display="block";
}

function showProjects(){
  document.getElementById("projectsContainer").style.display="block";
  document.querySelector(".deploy-box").style.display="none";
}

function toggleMenu(){
  const m = document.getElementById("menu");
  m.style.display = m.style.display==="none" ? "block" : "none";
}

    let socket;

function connectLogs(project){

    if(socket){
        socket.close();
    }

    socket = new WebSocket(`wss://devploy.onrender.com/ws/deploy/${project}`);

    socket.onmessage = (event) => {

        const data = JSON.parse(event.data);

        const logBox = document.getElementById("logs");

        const div = document.createElement("div");
        div.className = "log-line";
        div.innerText = data.msg;

        logBox.appendChild(div);

        // auto scroll
        logBox.scrollTop = logBox.scrollHeight;
    };
}


  
const API =
"https://devploy.onrender.com";

const token =
localStorage.getItem("token");

if(!token){

location.href="auth.html";

}

async function getMe(){

const res =
await fetch(
`${API}/me`,
{
headers:{
Authorization:
`Bearer ${token}`
}
}
);

if(!res.ok){

logout();
return;

}

const user =
await res.json();

document.getElementById(
"username"
).textContent =
user.username;

}

async function loadProjects(){

const res =
await fetch(
`${API}/my-projects`,
{
headers:{
Authorization:
`Bearer ${token}`
}
}
);

if(!res.ok){

logout();
return;

}

const projects =
await res.json();

const container =
document.getElementById(
"projectsContainer"
);

if(!projects.length){

container.innerHTML=
`
<div class="empty">
<h3>No Projects Yet</h3>
<p>Create your first deployment above.</p>
</div>
`;

return;

}

container.innerHTML=
`
<div class="grid">
${projects.map(project=>`
<div class="card">

<h3>${project.name}</h3>

<div class="meta">
Status: ${project.status}
</div>

<div class="meta">
${project.url}
</div>

<div class="actions">

<a
class="open"
href="${project.url}"
target="_blank">
Open
</a>

<button
class="copy"
onclick="copyUrl('${project.url}')">
Copy URL
</button>

</div>

</div>
`).join("")}
</div>
`;

}

function copyUrl(url){

navigator.clipboard.writeText(url);

}

async function deploy(){

const projectName =
document
.getElementById(
"projectName"
)
.value
.trim();

const repoUrl =
document
.getElementById(
"repoUrl"
)
.value
.trim();
const baseDir =
document
.getElementById(
"baseDir"
)
.value
.trim();

  
if(!projectName){

alert(
"Enter project name"
);

return;
}

if(!repoUrl){

alert(
"Enter repository URL"
);

return;
}

if(
!repoUrl.includes(
"github.com"
)
){

alert(
"Enter a valid GitHub URL"
);

return;
}

const btn =
document.getElementById(
"deployBtn"
);

btn.disabled=true;
btn.textContent=
"Deploying...";

try{

const res =
await fetch(
`${API}/deploy`,
{
method:"POST",

headers:{
"Content-Type":"application/json",
Authorization:`Bearer ${token}`
},

body:JSON.stringify({
project_name:projectName,
repo_url:repoUrl,
base_dir:baseDir
})

}
);


const data =
await res.json();
connectLogs(projectName)
if(!res.ok){

throw new Error(
data.detail ||
"Deploy failed"
);

}

const result =
document.getElementById(
"result"
);

result.style.display=
"block";

result.innerHTML=
`
<b>Deployment Successful</b>
<br><br>
<a href="${data.url}" target="_blank">
${data.url}
</a>
`;

loadProjects();

}catch(err){

alert(
err.message
);

}

btn.disabled=false;
btn.textContent=
"Deploy Project";

}

document
.getElementById(
"deployBtn"
)
.addEventListener(
"click",
deploy
);

function logout(){

localStorage.removeItem(
"token"
);

location.href=
"auth.html";

}

getMe();
loadProjects();

</script></body>
  </html>
