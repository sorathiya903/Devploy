
name: Devploy Framework Builder

run-name: Devploy build ${{ github.event.client_payload.build_id }}

on:
  repository_dispatch:
    types:
      - devploy_build

permissions: {}

jobs:
  build:
    name: Build customer repository
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # 1. Validate inputs
      - name: Validate and prepare inputs
        id: config
        shell: bash
        env:
          PROJECT_NAME: ${{ github.event.client_payload.project_name }}
          REPO_URL: ${{ github.event.client_payload.repo_url }}
          COMMIT_SHA: ${{ github.event.client_payload.commit_sha }}
          BASE_DIR: ${{ github.event.client_payload.base_dir }}
          INSTALL_COMMAND: ${{ github.event.client_payload.install_command }}
          BUILD_COMMAND: ${{ github.event.client_payload.build_command }}
          OUTPUT_DIR: ${{ github.event.client_payload.output_dir }}
        run: |
          set -euo pipefail

          echo "========== RECEIVED CONFIGURATION =========="
          echo "Repository: $REPO_URL"
          echo "Commit SHA: ${COMMIT_SHA:-latest}"
          echo "Base directory: ${BASE_DIR:-repository root}"
          echo "Install command: $INSTALL_COMMAND"
          echo "Build command: $BUILD_COMMAND"
          echo "Output directory: $OUTPUT_DIR"
          echo "============================================"

          if [[ ! "$PROJECT_NAME" =~ ^[a-z0-9-]{1,50}$ ]]; then
            echo "::error::Invalid project name"
            exit 1
          fi
          
          if [[ ! "$REPO_URL" =~ ^https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+(\.git)?/?$ ]]; then
            echo "::error::Invalid GitHub repository URL"
            exit 1
          fi

          if [[ -n "$COMMIT_SHA" && ! "$COMMIT_SHA" =~ ^[a-fA-F0-9]{40,64}$ ]]; then
            echo "::error::Invalid commit SHA"
            exit 1
          fi

          if [[ -z "$INSTALL_COMMAND" || -z "$BUILD_COMMAND" || -z "$OUTPUT_DIR" ]]; then
            echo "::error::Install command, build command and output directory are required"
            exit 1
          fi

          if [[ "$OUTPUT_DIR" = /* || "$OUTPUT_DIR" == *".."* ]]; then
            echo "::error::Invalid output directory"
            exit 1
          fi

          if [[ "$BASE_DIR" = /* || "$BASE_DIR" == *".."* ]]; then
            echo "::error::Invalid base directory"
            exit 1
          fi


          echo "project_name=$PROJECT_NAME" >> "$GITHUB_OUTPUT"
          echo "repo_url=$REPO_URL" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          echo "base_dir=$BASE_DIR" >> "$GITHUB_OUTPUT"
          echo "output_dir=$OUTPUT_DIR" >> "$GITHUB_OUTPUT"

      # 2. Clone repository
      - name: Clone repository
        shell: bash
        env:
          REPO_URL: ${{ steps.config.outputs.repo_url }}
          COMMIT_SHA: ${{ steps.config.outputs.commit_sha }}
        run: |
          set -euo pipefail

          echo "========== CLONING REPOSITORY =========="

          git clone --depth 1 "$REPO_URL" source

          if [[ -n "$COMMIT_SHA" ]]; then
            git -C source fetch --depth 1 origin "$COMMIT_SHA"
            git -C source checkout --detach FETCH_HEAD
          fi

          echo "========== CLONE DETAILS =========="
          git -C source log -1 --oneline
          echo "Repository root:"
          ls -la source

      # 3. Select project directory
      - name: Select project directory
        id: project
        shell: bash
        env:
          BASE_DIR: ${{ steps.config.outputs.base_dir }}
        run: |
          set -euo pipefail

          SOURCE="$(realpath -e source)"

          if [[ -n "$BASE_DIR" ]]; then
            PROJECT_CANDIDATE="$SOURCE/$BASE_DIR"

            if [[ ! -d "$PROJECT_CANDIDATE" ]]; then
              echo "::error::Base directory '$BASE_DIR' does not exist"
              echo "Repository contents:"
              find "$SOURCE" -maxdepth 3 -type d \
                -not -path '*/.git*' \
                -not -path '*/node_modules*'
              exit 1
            fi

            PROJECT_DIR="$(realpath -e "$PROJECT_CANDIDATE")"
          else
            PROJECT_DIR="$SOURCE"
          fi

          case "$PROJECT_DIR/" in
            "$SOURCE/"*) ;;
            *)
              echo "::error::Project directory is outside repository"
              exit 1
              ;;
          esac

          echo "Selected project directory: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "========== PROJECT CONTENTS =========="
          ls -la "$PROJECT_DIR"

      # 4. Debug before installation
      - name: Debug before installation
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          echo "========== INSTALLATION DEBUG =========="
          echo "Working directory: $PROJECT_DIR"

          if [[ -f "$PROJECT_DIR/package.json" ]]; then
            echo "package.json found:"
            cat "$PROJECT_DIR/package.json"
          else
            echo "::warning::package.json not found in project root"
          fi

          echo "Node version:"
          node --version

          echo "NPM version:"
          npm --version

      # 5. Install dependencies
      - name: Install dependencies
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
          INSTALL_COMMAND: ${{ github.event.client_payload.install_command }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "========== INSTALLING DEPENDENCIES =========="
          echo "Command: $INSTALL_COMMAND"

          bash -e -c "$INSTALL_COMMAND"

          echo "========== INSTALLATION COMPLETED =========="

      # 6. Build project
      - name: Build project
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
          BUILD_COMMAND: ${{ github.event.client_payload.build_command }}
          PUBLIC_URL: "."
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "========== BUILD STARTED =========="
          echo "Working directory: $(pwd)"
          echo "Build command: $BUILD_COMMAND"

          bash -e -c "$BUILD_COMMAND"

          echo "========== BUILD COMPLETED =========="

      # 7. Debug after build
      - name: Debug build output
        if: always()
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
          OUTPUT_DIR: ${{ steps.config.outputs.output_dir }}
        run: |
          echo "========== BUILD OUTPUT DEBUG =========="
          echo "Project directory: ${PROJECT_DIR:-not available}"
          echo "Expected output directory: ${OUTPUT_DIR:-not available}"

          if [[ -n "${PROJECT_DIR:-}" && -d "$PROJECT_DIR" ]]; then
            echo ""
            echo "Project root contents:"
            ls -lah "$PROJECT_DIR"

            echo ""
            echo "Available directories:"
            find "$PROJECT_DIR" -maxdepth 4 -type d \
              -not -path '*/node_modules*' \
              -not -path '*/.git*'

            echo ""
            echo "HTML files:"
            find "$PROJECT_DIR" -maxdepth 5 -type f \
              -name "index.html" \
              -not -path '*/node_modules/*' \
              -not -path '*/.git/*'
          fi

          if [[ -n "${PROJECT_DIR:-}" && -n "${OUTPUT_DIR:-}" ]]; then
            echo ""
            echo "Expected output path:"
            ls -lah "$PROJECT_DIR/$OUTPUT_DIR" || true
          fi

      # 8. Prepare artifact
      - name: Prepare build artifact
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
          OUTPUT_DIR: ${{ steps.config.outputs.output_dir }}
        run: |
          set -euo pipefail

          echo "========== PREPARING ARTIFACT =========="

          PROJECT_REAL="$(realpath -e "$PROJECT_DIR")"
          OUTPUT_CANDIDATE="$PROJECT_REAL/$OUTPUT_DIR"

          echo "Project: $PROJECT_REAL"
          echo "Output candidate: $OUTPUT_CANDIDATE"

          if [[ ! -d "$OUTPUT_CANDIDATE" ]]; then
            echo "::error::Build output directory '$OUTPUT_DIR' does not exist"

            echo "Available project directories:"
            find "$PROJECT_REAL" -maxdepth 4 -type d \
              -not -path '*/node_modules*' \
              -not -path '*/.git*'

            exit 1
          fi

          OUTPUT_PATH="$(realpath -e "$OUTPUT_CANDIDATE")"

          case "$OUTPUT_PATH/" in
            "$PROJECT_REAL/"*) ;;
            *)
              echo "::error::Output directory is outside project directory"
              exit 1
              ;;
          esac

          if [[ ! -f "$OUTPUT_PATH/index.html" ]]; then
            echo "::error::index.html not found in build output"
            echo "Output directory contents:"
            ls -lah "$OUTPUT_PATH"
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/artifact"

          cp -a "$OUTPUT_PATH/." "$GITHUB_WORKSPACE/artifact/"

          git -C source rev-parse HEAD \
            > "$GITHUB_WORKSPACE/artifact/devploy_commit.txt"

          echo "========== ARTIFACT CONTENTS =========="
          find "$GITHUB_WORKSPACE/artifact" -maxdepth 4 -type f

          echo "Artifact prepared successfully"


       
      - name: Checkout Devploy scripts
        uses: actions/checkout@v4
        with:
          path: devploy-source
          sparse-checkout: |
            backend/rewrite_path.py
          sparse-checkout-cone-mode: false
                
      - name: Rewrite deployment paths
        shell: bash
        env:
          PROJECT_NAME: ${{ steps.config.outputs.project_name }}
        run: |
          set -euo pipefail

            
          echo "Current directory:"
          pwd

          echo "Root files:"
          ls -la

          echo "Backend files:"
          ls -la backend/ || true

          echo "Searching for rewrite_path.py:"
          find . -name "rewrite_path.py" -not -path "*/.git/*"

          echo "========== PATH REWRITING =========="

          python devploy-source/backend/rewrite_path.py \
            artifact \
            "$PROJECT_NAME"

          echo "========== VERIFYING ARTIFACT =========="

          find artifact -maxdepth 3 -type f

      # 9. Upload artifact
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: artifact/
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
